# The Ghostty config ascii_city is run and looked at in.
# Ghostty does not read this file by itself. Copy the lines into Ghostty's config
# (on a Mac: ~/.config/ghostty/config; reload with cmd+shift+comma), or point it here
# with a line there: config-file = /path/to/ascii_city/ghostty.conf

# Font: a mono font with full block/box glyph coverage, ligatures off
font-family = JetBrains Mono
font-size = 12
font-feature = -calt
font-feature = -liga
font-feature = -dlig
# Slightly heavier glyphs, so the fine dots (stars, rain, snow) read better
font-thicken = true

# Opaque background, so colors and contrast render accurately
background-opacity = 1
theme = Hardcore
background = #000000

# No cursor flicker over the animation
cursor-style = block
cursor-style-blink = false

# Even padding so the canvas is centered, not stuck to one edge
window-padding-x = 8
window-padding-y = 8
window-padding-balance = true

# Start with a big grid (columns x rows) so the city has room
window-width = 200
window-height = 55

# A clean window for showing it to people: no title bar, no mouse pointer on the city
macos-titlebar-style = hidden
mouse-hide-while-typing = true

# Optional, and it changes the look: the city assumes cells exactly twice as tall as
# wide, and JetBrains Mono's are about 2.2, so round things come out a little tall.
# This makes them exact, at the price of slightly tighter rows. Try it before keeping.
# adjust-cell-height = -9%
